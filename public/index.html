<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majoléo - Ressources et contenus pédagogiques</title>
    <!-- Importation de la police moderne Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <span class="header-badge">Boutique Pédagogique</span>
            <h1>Majoléo</h1>
            <p class="header-slogan">Apprendre, c’est notre terrain de jeu</p>
        </div>
    </header>

    <main class="main-container">
        <section class="products-section">
            <h2>Nos contenus disponibles</h2>
            <div id="products-container" class="grid-container">
                <!-- Les produits s'afficheront ici automatiquement -->
            </div>
        </section>

        <aside class="cart-section card">
            <h2>Votre Panier</h2>
            <ul id="cart-items" class="cart-list">
                <li>Votre panier est vide.</li>
            </ul>
            <div class="cart-summary">
                <p><strong>Total : <span id="cart-total">0.00 €</span></strong></p>
                <button id="checkout-btn" class="btn">Procéder au paiement</button>
            </div>
        </aside>
    </main>

    <!-- Le lien vers votre fichier JavaScript -->
    <script src="app.js"></script>

</html>
