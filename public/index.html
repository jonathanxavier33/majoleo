<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Boutique Pédagogique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Boutique Pédagogique</h1>
        <p>Ressources et contenus pour vos cours</p>
    </header>

    <main>
        <section>
            <h2>Nos contenus disponibles</h2>
            <div id="products-container">
                <!-- Les produits s'afficheront ici automatiquement -->
            </div>
        </section>

        <section id="cart-section">
            <h2>Votre Panier</h2>
            <ul id="cart-items">
                <li>Votre panier est vide.</li>
            </ul>
            <p><strong>Total : <span id="cart-total">0.00 €</span></strong></p>
            <button id="checkout-btn">Procéder au paiement</button>
        </section>
    </main>

    <!-- Le lien vers votre fichier JavaScript -->
    <script src="app.js"></script>
</body>
</html>
